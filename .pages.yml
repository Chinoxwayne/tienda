media:
  input: images
  output: /images
content:
  - name: productos
    label: Productos
    type: file
    path: products.json
    format: json
    list: true
    fields:
      - name: name
        label: Nombre
        type: string
        required: true
      - name: price
        label: Precio (RD$)
        type: number
        required: true
      - name: cat
        label: Categoría
        type: select
        required: true
        options:
          values: [Maquillaje, Skincare, Cuidado y fragancias]
      - name: desc
        label: Descripción
        type: text
      - name: img
        label: Foto principal
        type: image
      - name: extras
        label: Fotos extra (galería)
        type: image
        list: true
      - name: tonos
        label: Tonos (opcional, para productos con varios colores)
        type: object
        list: true
        fields:
          - name: nombre
            label: Nombre del tono
            type: string
            required: true
          - name: img
            label: Foto de este tono (800 x 800 px, fondo transparente si es posible)
            type: image
          - name: color
            label: Color del círculo (opcional, ej. #D9667A). Si lo dejas vacío se toma de la foto
            type: string
          - name: disponible
            label: Disponible
            type: boolean
            default: true
      - name: tag
        label: Etiqueta (opcional, por ejemplo Nuevo)
        type: string
      - name: disponible
        label: Disponible
        type: boolean
        default: true
      - name: id
        label: Código (déjalo vacío en productos nuevos)
        type: string
  - name: imagenes
    label: Imágenes de la página
    type: file
    path: site.json
    format: json
    fields:
      - name: imagen_rutina
        label: Foto "Tu rutina. Tu espacio. Tu glow." (1200 x 1200 px, cuadrada)
        type: image
      - name: cat_maquillaje
        label: Tarjeta Maquillaje (900 x 900 px, cuadrada)
        type: image
      - name: cat_skincare
        label: Tarjeta Skincare (900 x 900 px, cuadrada)
        type: image
      - name: cat_cremas
        label: Tarjeta Cremas (900 x 900 px, cuadrada)
        type: image
      - name: cat_accesorios
        label: Tarjeta Accesorios (900 x 900 px, cuadrada)
        type: image